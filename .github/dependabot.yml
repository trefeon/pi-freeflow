version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Types must not outrun the runtime floor: @types/node 26 advertises Node
      # 26 APIs that a Node >=22.19.0 runtime does not have, so the major bump
      # can never land while engines stays on 22. Patch/minor updates in the
      # 22.x line still arrive.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
