name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-publish:
    name: Validate, Verify & Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Validate tag against package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # workflow_dispatch runs never reach this step (see the if: above); the
          # guard below also keeps direct shell invocations honest.
          if [ "${GITHUB_REF_TYPE:-tag}" != "tag" ]; then
            echo "Not a tag build (ref type: ${GITHUB_REF_TYPE:-unset}) — skipping tag/version validation"
            exit 0
          fi

          TAG_REF="${GITHUB_REF_NAME:-${GITHUB_REF:-}}"
          TAG_VERSION="${TAG_REF#refs/tags/}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${TAG_REF} (${TAG_VERSION}) does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Tag ${TAG_REF} matches package.json version ${PKG_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run test suite
        run: pnpm test

      - name: Verify published tarball matches this tree
        run: node scripts/verify-published-tarball.mjs

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
