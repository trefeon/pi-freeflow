name: OpenCode Upstream Watcher

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      rebaseline:
        description: "Re-baseline the watcher state and close any open drift issue"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: opencode-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Check Upstream OpenCode Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"

      - name: Rebaseline Watcher State
        if: github.event.inputs.rebaseline == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Manual path: trust live upstream for every watched file, critical
          # included, and write the full baseline. No issue is created here.
          node scripts/opencode-watch.mjs --update --output drift-report.md

      - name: Run OpenCode Watch Check
        id: check
        if: github.event.inputs.rebaseline != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # --advance re-baselines informational signals (release, zen.mdx, the
          # model listing) so they report once, while holding the previous SHA of
          # a critically changed schema file: that alert repeats until a human
          # re-baselines with the rebaseline dispatch input.
          node scripts/opencode-watch.mjs --check --advance --output drift-report.md
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ $EXIT_CODE -eq 2 ]; then
            echo "Watcher infra failure (exit code 2) — report only, no drift issue"
            echo "INFRA_FAILURE=true" >> "$GITHUB_ENV"
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "Critical drift detected (exit code $EXIT_CODE)"
            echo "INFRA_FAILURE=false" >> "$GITHUB_ENV"
          else
            echo "No critical drift (exit code 0)"
            echo "INFRA_FAILURE=false" >> "$GITHUB_ENV"
          fi

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f drift-report.md ]; then
            cat drift-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Annotate Infra Failure
        if: always() && env.INFRA_FAILURE == 'true'
        run: |
          echo "::error::OpenCode watcher infra failure — see step summary; no drift issue filed."

      - name: File or Update Critical Drift Issue
        if: steps.check.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="opencode-drift"
          # Ensure label exists in repository
          gh label create "$LABEL" --description "Critical upstream OpenCode drift (session-ID/auth format)" --color "d73a4a" --force || true

          # Materialize the fallback so gh is always handed a file. A quoted
          # "--body <text>" string kept in a variable is word-split and reaches
          # gh as a broken argument list.
          if [ ! -f drift-report.md ]; then
            printf '%s\n' "Critical OpenCode upstream drift detected but drift-report.md is missing. See workflow logs." > drift-report.md
          fi

          # One issue per open drift: edit its body in place instead of
          # commenting on every scheduled run.
          EXISTING_ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Updating existing drift issue #$EXISTING_ISSUE"
            gh issue edit "$EXISTING_ISSUE" --body-file drift-report.md
          else
            echo "Creating new drift issue"
            CURRENT_DATE=$(date -u +'%Y-%m-%d')
            gh issue create \
              --title "🚨 OpenCode Upstream Drift Detected (${CURRENT_DATE})" \
              --label "$LABEL" \
              --body-file drift-report.md
          fi

      - name: Close Recovered Drift Issue
        if: steps.check.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="opencode-drift"
          # Exit 0 means no critical drift: informational signals may have moved
          # (and were re-baselined by --advance), but session format is intact.
          # Exit 1 keeps the issue open; exit 2 never reached upstream.
          EXISTING_ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_ISSUE" ]; then
            echo "No open $LABEL issue to close"
          else
            CURRENT_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
            echo "No critical drift — closing drift issue #$EXISTING_ISSUE"
            gh issue comment "$EXISTING_ISSUE" --body "OpenCode upstream is back in sync as of ${CURRENT_DATE}: no critical schema change is outstanding. Auto-closing this drift alert."
            gh issue close "$EXISTING_ISSUE" --reason completed
          fi

      - name: Close Drift Issue After Rebaseline
        if: github.event.inputs.rebaseline == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="opencode-drift"
          EXISTING_ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_ISSUE" ]; then
            echo "No open $LABEL issue to close"
          else
            CURRENT_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
            echo "Baseline re-established — closing drift issue #$EXISTING_ISSUE"
            gh issue comment "$EXISTING_ISSUE" --body "Watcher baseline re-established by a manual rebaseline as of ${CURRENT_DATE}."
            gh issue close "$EXISTING_ISSUE" --reason completed
          fi

      - name: Commit Watcher State
        # Advance the committed baseline after any successful read (exit 0 or 1),
        # not only when a critical alert fires: informational churn must not be
        # re-reported on the next run.
        if: github.event.inputs.rebaseline == 'true' || steps.check.outputs.exit_code == '0' || steps.check.outputs.exit_code == '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/opencode-watch-state.json

          if ! git diff --cached --quiet; then
            git commit -m "chore(watch): update opencode watch state [skip ci]"

            # A concurrent commit on main would strand the drift baseline, so
            # rebase onto the latest main before pushing and retry the push.
            git pull --rebase --autostash

            push_ok=0
            for attempt in 1 2 3; do
              if git push; then
                push_ok=1
                break
              fi
              echo "Push attempt $attempt failed; rebasing on the latest main and retrying"
              sleep 5
              git pull --rebase --autostash
            done

            if [ "$push_ok" -ne 1 ]; then
              echo "::error::Failed to push the opencode watch state after 3 attempts"
              exit 1
            fi
          else
            echo "No state changes to commit"
          fi
