name: OpenCode Upstream Watcher

on:
  schedule:
    # Daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: opencode-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Check Upstream OpenCode Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"

      - name: Run OpenCode Watch Check
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/opencode-watch.mjs --check --output drift-report.md
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ $EXIT_CODE -eq 2 ]; then
            echo "Watcher infra failure (exit code 2) — report only, no drift issue"
            echo "DRIFT_DETECTED=false" >> "$GITHUB_ENV"
            echo "INFRA_FAILURE=true" >> "$GITHUB_ENV"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "Drift detected (exit code $EXIT_CODE)"
            echo "DRIFT_DETECTED=true" >> "$GITHUB_ENV"
            echo "INFRA_FAILURE=false" >> "$GITHUB_ENV"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "No drift detected (exit code 0)"
            echo "DRIFT_DETECTED=false" >> "$GITHUB_ENV"
            echo "INFRA_FAILURE=false" >> "$GITHUB_ENV"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f drift-report.md ]; then
            cat drift-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Annotate Infra Failure
        if: always() && env.INFRA_FAILURE == 'true'
        run: |
          echo "::error::OpenCode watcher infra failure — see step summary; no drift issue filed."

      - name: Open or Update GitHub Issue on Drift
        if: env.DRIFT_DETECTED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="opencode-drift"
          # Ensure label exists in repository
          gh label create "$LABEL" --description "Upstream OpenCode drift detected" --color "d73a4a" --force || true

          # Materialize the fallback so gh is always handed a file. A quoted
          # "--body <text>" string kept in a variable is word-split and reaches
          # gh as a broken argument list.
          if [ ! -f drift-report.md ]; then
            printf '%s\n' "OpenCode upstream drift detected but drift-report.md is missing. See workflow logs." > drift-report.md
          fi

          # Check for existing open issue with the opencode-drift label
          EXISTING_ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Updating existing drift issue #$EXISTING_ISSUE"
            gh issue comment "$EXISTING_ISSUE" --body-file drift-report.md
          else
            echo "Creating new drift issue"
            CURRENT_DATE=$(date -u +'%Y-%m-%d')
            gh issue create \
              --title "🚨 OpenCode Upstream Drift Detected (${CURRENT_DATE})" \
              --label "$LABEL" \
              --body-file drift-report.md
          fi

      - name: Update State and Commit
        if: env.DRIFT_DETECTED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Updating .github/opencode-watch-state.json..."
          node scripts/opencode-watch.mjs --update

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/opencode-watch-state.json

          if ! git diff --cached --quiet; then
            git commit -m "chore(watch): update opencode watch state [skip ci]"

            # A concurrent commit on main would strand the drift baseline, so
            # rebase onto the latest main before pushing and retry the push.
            git pull --rebase --autostash

            push_ok=0
            for attempt in 1 2 3; do
              if git push; then
                push_ok=1
                break
              fi
              echo "Push attempt $attempt failed; rebasing on the latest main and retrying"
              sleep 5
              git pull --rebase --autostash
            done

            if [ "$push_ok" -ne 1 ]; then
              echo "::error::Failed to push the opencode watch state after 3 attempts"
              exit 1
            fi
          else
            echo "No state changes to commit"
          fi
