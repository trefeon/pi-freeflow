name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Trusted code only: the maintainer's own pushes and manual runs.
  #
  # This job targets a SELF-HOSTED runner on the maintainer's own machine. A
  # self-hosted runner executes whatever the workflow tells it to, so it must
  # never pick up a `pull_request` event: this is a public repository, and any
  # anonymous fork can open a pull request whose package.json scripts or test
  # files run as that machine's user. `pull_request` is therefore handled by
  # the `test` matrix below on GitHub-hosted runners, and this job is gated to
  # the events that only the maintainer can trigger.
  test-local:
    name: Test (acerblue-local - Node 22.x)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, acerblue-local]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Build docs (vitepress)
        run: pnpm run docs:build

      - name: Smoke test (extension entrypoint)
        run: pnpm run smoke

      - name: Run test suite
        run: pnpm test

  # Untrusted code only: fork pull requests, on GitHub-hosted runners.
  #
  # This is where cross-platform coverage comes from. A push to main runs the
  # same checks once on the local Linux runner above, so Windows and macOS are
  # verified at review time rather than at merge time.
  test:
    name: Test (${{ matrix.os }} - Node ${{ matrix.node-version }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["22.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Build docs (vitepress)
        run: pnpm run docs:build

      - name: Smoke test (extension entrypoint)
        run: pnpm run smoke

      - name: Run test suite
        run: pnpm test

  package-check:
    name: Package Integrity & Tarball Whitelist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate npm package contents
        run: |
          echo "=== Verifying npm package tarball contents ==="
          npm pack --dry-run

          PACK_FILES=$(npm pack --dry-run --json 2>/dev/null | node -e "
            let d='';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              try {
                const j = JSON.parse(d);
                const files = j[0]?.files?.map(f => f.path) || [];
                console.log(files.join('\n'));
              } catch {}
            });
          ")

          if echo "$PACK_FILES" | grep -E "(test/|devdocs/|devthings/|reference/|\.env)"; then
            echo "ERROR: Forbidden files found in npm package whitelist!"
            exit 1
          fi
          echo "✓ Package bundle is clean and strictly whitelisted."
