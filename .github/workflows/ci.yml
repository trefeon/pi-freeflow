name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_self_hosted:
        description: "Run on self-hosted acerblue-local runner (fallback when GitHub Actions quota is limited)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} - Node ${{ matrix.node-version }})
    if: "!inputs.use_self_hosted"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["lts/*", "22.19.0"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Build docs (vitepress)
        run: pnpm run docs:build

      - name: Smoke test (extension entrypoint)
        run: pnpm run smoke

      - name: Run test suite
        run: pnpm test

  # Fallback runner: only used when explicitly requested (e.g. GitHub Actions minutes limit reached)
  test-local:
    name: Test (acerblue-local - Node 22.x fallback)
    if: "inputs.use_self_hosted == true"
    runs-on: [self-hosted, Linux, X64, acerblue-local]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Build docs (vitepress)
        run: pnpm run docs:build

      - name: Smoke test (extension entrypoint)
        run: pnpm run smoke

      - name: Run test suite
        run: pnpm test

  package-check:
    name: Package Integrity & Tarball Whitelist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate npm package contents
        run: |
          echo "=== Verifying npm package tarball contents ==="
          npm pack --dry-run

          PACK_FILES=$(npm pack --dry-run --json 2>/dev/null | node -e "
            let d='';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              try {
                const j = JSON.parse(d);
                const files = j[0]?.files?.map(f => f.path) || [];
                console.log(files.join('\n'));
              } catch {}
            });
          ")

          if echo "$PACK_FILES" | grep -E "(test/|devdocs/|devthings/|reference/|\.env)"; then
            echo "ERROR: Forbidden files found in npm package whitelist!"
            exit 1
          fi
          echo "✓ Package bundle is clean and strictly whitelisted."
