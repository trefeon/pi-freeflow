name: OpenCode Free-Tier Models Health Check

on:
  schedule:
    # Run every 12 hours (06:00 and 18:00 UTC)
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: opencode-model-check
  cancel-in-progress: false

jobs:
  check-models:
    name: Probe OpenCode Free Models
    runs-on: ubuntu-latest
    # Worst case is 12 catalog models x (3 attempts x 25s probe timeout + 2s + 5s
    # backoff) =~ 16.5 min plus install — a 15-min ceiling would kill the job and
    # swallow the alert exactly when a mass upstream hang needs it filed.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Probe All OpenCode Free Tier Models
        id: probe
        run: |
          set +e
          node --experimental-strip-types scripts/check-opencode-models.ts \
            --output model-health-report.md \
            --json-output model-health.json
          EXIT_CODE=$?
          set -e

          # The JSON contract lives in its own file: the workflow never parses
          # human progress lines, so a new log line cannot break the counts.

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ $EXIT_CODE -eq 2 ]; then
            echo "Probe infra failure (exit code 2) — report only, no alert issue"
            echo "AFFECTED_MODELS=false" >> "$GITHUB_ENV"
            echo "INFRA_FAILURE=true" >> "$GITHUB_ENV"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "Dead model(s) detected (exit code 1)"
            echo "AFFECTED_MODELS=true" >> "$GITHUB_ENV"
            echo "INFRA_FAILURE=false" >> "$GITHUB_ENV"
          elif [ $EXIT_CODE -eq 0 ]; then
            # Exit 0 covers healthy, unavailable, and timeout alike: availability
            # faults are reported in the summary above but never open an issue.
            echo "No dead OpenCode free model (exit code 0)"
            echo "AFFECTED_MODELS=false" >> "$GITHUB_ENV"
            echo "INFRA_FAILURE=false" >> "$GITHUB_ENV"
          else
            # A signal death or an unhandled crash must not look like a healthy
            # run: only exit 0 may close an alert, and only exit 1 may file one.
            echo "Unexpected probe exit code $EXIT_CODE — treating as infra failure"
            echo "AFFECTED_MODELS=false" >> "$GITHUB_ENV"
            echo "INFRA_FAILURE=true" >> "$GITHUB_ENV"
          fi

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f model-health-report.md ]; then
            cat model-health-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Annotate Infra Failure
        if: always() && env.INFRA_FAILURE == 'true'
        run: |
          echo "::error::OpenCode free-model probe infra failure — see step summary; no alert issue filed."

      - name: Annotate Unavailable Models (No Alert)
        if: always() && env.INFRA_FAILURE != 'true' && env.AFFECTED_MODELS != 'true'
        run: |
          # Availability faults and probe timeouts exit 0 and never open an
          # issue; this annotation is the only trace on the run itself. Counts
          # come from the probe's own --json output — never a second probe.
          if [ ! -s model-health.json ]; then
            echo "No probe JSON available; skipping degraded-model annotation"
            exit 0
          fi
          DEGRADED=$(node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("model-health.json", "utf8"));
            process.stdout.write(String(report.degradedCount ?? 0));
          ' 2>/dev/null) || DEGRADED=0
          case "$DEGRADED" in ''|*[!0-9]*) DEGRADED=0 ;; esac
          if [ "${DEGRADED:-0}" -gt 0 ]; then
            echo "::warning::${DEGRADED} OpenCode free-tier model(s) unavailable or inconclusive — availability fault retried at probe time; no catalog action and no alert issue filed."
          fi

      - name: Open or Update GitHub Issue on Dead Models
        if: env.AFFECTED_MODELS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="opencode-model-alert"
          gh label create "$LABEL" --description "OpenCode free-tier model alert" --color "b60205" --force || true

          # gh must always read a real file: an inline --body value would be split by the
          # shell, so a missing report is replaced by a one-line fallback first.
          if [ ! -f model-health-report.md ]; then
            printf '%s\n' "OpenCode free-tier probe reported dead model(s) but model-health-report.md is missing. See the workflow run logs." > model-health-report.md
          fi

          EXISTING_ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_ISSUE" ]; then
            # Replace the body, never append: otherwise every 12h run stacks a
            # comment and the current verdict buries under stale ones.
            echo "Replacing body of existing alert issue #$EXISTING_ISSUE"
            gh issue edit "$EXISTING_ISSUE" --body-file model-health-report.md
          else
            echo "Creating new alert issue"
            CURRENT_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
            gh issue create \
              --title "🚨 OpenCode Free Tier Model Dead (${CURRENT_DATE})" \
              --label "$LABEL" \
              --body-file model-health-report.md
          fi

          # A run that touched the alert must never also close it: the close step
          # is exit-0-only, and this guard states the invariant in the shell too.
          echo "ALERT_ISSUE_TOUCHED=true" >> "$GITHUB_ENV"

      - name: Close Recovered Alert Issue
        if: steps.probe.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL="opencode-model-alert"
          if [ "${ALERT_ISSUE_TOUCHED:-false}" = "true" ]; then
            echo "This run updated the alert issue; a later healthy run owns the close"
            exit 0
          fi
          EXISTING_ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_ISSUE" ]; then
            echo "No open $LABEL issue to close"
          else
            CURRENT_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')
            echo "No OpenCode free-tier model is dead as of ${CURRENT_DATE} — closing alert issue #$EXISTING_ISSUE"
            gh issue comment "$EXISTING_ISSUE" --body "No OpenCode free-tier model is dead as of ${CURRENT_DATE}. Availability faults do not keep this alert open. Auto-closing."
            gh issue close "$EXISTING_ISSUE" --reason completed
          fi
